<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Studio Board: приём картинок</title>
<style>
  body { background: #0f1115; color: #e9ecf2; font: 14px/1.5 Inter, system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; }
  .box { background: #1b1f29; border: 1px solid #2c3241; border-radius: 14px; padding: 22px 26px; min-width: 340px; }
  h1 { font-size: 17px; margin: 0 0 8px; } #log { color: #9098aa; white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<div class="box"><h1>Приём картинок для доски</h1><div id="log">Жду картинки со страницы Flow…</div></div>
<script>
// Chrome blocks Flow -> 127.0.0.1 requests (Local Network Access), so the Flow page opens this same-origin
// page and hands images over with postMessage; this page posts them to the board with the job token.
const ALLOWED = new Set(['https://flow.google.com', 'https://labs.google'])
const log = t => { document.getElementById('log').textContent += '\n' + t }
window.addEventListener('message', async e => {
  if (!ALLOWED.has(e.origin)) return
  const m = e.data || {}
  if (m.type !== 'studio-image' || !m.job || !m.token || !m.data) return
  const reply = r => e.source?.postMessage({ type: 'studio-image-ack', seq: m.seq, ...r }, e.origin)
  try {
    const q = new URLSearchParams({ token: m.token, ext: m.ext || 'png', prompt: m.prompt || '', view: m.view || '' })
    const r = await fetch(`/api/jobs/${encodeURIComponent(m.job)}/image?${q}`, { method: 'POST', body: m.data })
    const j = await r.json().catch(() => ({}))
    if (!r.ok) throw new Error(j.error || r.statusText)
    log(`✓ картинка ${m.seq ?? ''} принята`); reply({ ok: true, file: j.file })
  } catch (err) { log(`✗ ${err.message}`); reply({ ok: false, error: err.message }) }
})
// works as a tab opened by the Flow page or, without any tab, as a hidden iframe inside it
const host = window.parent !== window ? window.parent : window.opener
if (host) host.postMessage({ type: 'studio-receiver-ready' }, '*')
</script>
</body>
</html>
